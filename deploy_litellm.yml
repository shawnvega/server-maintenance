---
- name: Deploy LiteLLM Proxy to Raspberry Pi 5
  hosts: 192.168.4.5
  gather_facts: true
  vars:
    stack_item: "docker/litellm"
  tasks:
    - name: Load vault variables if available
      ansible.builtin.include_vars:
        file: vars/vault.yml
      failed_when: false

    - name: Deploy and restart LiteLLM stack
      ansible.builtin.include_tasks: tasks/restart_docker_stack.yml
