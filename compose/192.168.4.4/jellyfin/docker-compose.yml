services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
      #user: uid:gid
    user: 1000:1000
    network_mode: 'host'
    volumes:
      - /home/shawn/docker/jellyfin/config:/config
      - /srv/dev-disk-by-uuid-572f06f7-537c-4a40-8070-1952f73f65e2/jellyfin/cache:/cache
      - type: bind
        source: /srv/dev-disk-by-uuid-572f06f7-537c-4a40-8070-1952f73f65e2/movies_shows/MP4s/Movies
        target: /movies
        read_only: true
      - type: bind
        source: /srv/dev-disk-by-uuid-572f06f7-537c-4a40-8070-1952f73f65e2/movies_shows/MP4s/Shows
        target: /shows
        read_only: true
      # Optional - extra fonts to be used during transcoding with subtitle burn-in
      #- type: bind
      #  source: /path/to/fonts
      #  target: /usr/local/share/fonts/custom
      #  read_only: true
    restart: 'unless-stopped'
    # Optional - alternative address used for autodiscovery
    #environment:
      #  - JELLYFIN_PublishedServerUrl=http://example.com
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - 'host.docker.internal:host-gateway'

