services:

  monitoring:
    image: nicolargo/glances:latest
    restart: always
    pid: host
    network_mode: host
    ports:
      - "61208:61208" # Port for the web UI (default)
      - "61209:61209" # Port for the API (default)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Mounts Docker socket for container monitoring
      - /etc/timezone:/etc/timezone:ro # Syncs container timezone with host
      - /etc/localtime:/etc/localtime:ro # Syncs container local time with host
      # Uncomment the below line if you want glances to display host OS detail instead of container's
      - /etc/os-release:/etc/os-release:ro
    environment:
      - "GLANCES_OPT=-w"
    labels:
      - "traefik.port=61208"
      - "traefik.frontend.rule=Host:glances.docker.localhost"

