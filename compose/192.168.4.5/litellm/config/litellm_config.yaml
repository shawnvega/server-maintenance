model_list:
  # Primary LLM routes on Apple Silicon Mac (Metal GPU)
  # --- 12B Coding Model ---
  - model_name: ollama/gemma4:12b-mlx-code
    litellm_params:
      model: ollama_chat/gemma4:12b-mlx-code
      api_base: http://192.168.4.8:11434
    model_info:
      max_input_tokens: 131072
      max_output_tokens: 16384

  - model_name: gemma4:12b-mlx-code
    litellm_params:
      model: ollama_chat/gemma4:12b-mlx-code
      api_base: http://192.168.4.8:11434
    model_info:
      max_input_tokens: 131072
      max_output_tokens: 16384

  - model_name: coding-12b
    litellm_params:
      model: ollama_chat/gemma4:12b-mlx-code
      api_base: http://192.168.4.8:11434
    model_info:
      max_input_tokens: 131072
      max_output_tokens: 16384

  # --- 26B Coding Model (Default) ---
  - model_name: ollama/gemma4:26b-mlx-code
    litellm_params:
      model: ollama_chat/gemma4:26b-mlx-code
      api_base: http://192.168.4.8:11434
    model_info:
      max_input_tokens: 131072
      max_output_tokens: 16384

  - model_name: gemma4:26b-mlx-code
    litellm_params:
      model: ollama_chat/gemma4:26b-mlx-code
      api_base: http://192.168.4.8:11434
    model_info:
      max_input_tokens: 131072
      max_output_tokens: 16384

  - model_name: coding-26b
    litellm_params:
      model: ollama_chat/gemma4:26b-mlx-code
      api_base: http://192.168.4.8:11434
    model_info:
      max_input_tokens: 131072
      max_output_tokens: 16384

  # --- 31B Coding Model ---
  - model_name: ollama/gemma4:31b-mlx-code
    litellm_params:
      model: ollama_chat/gemma4:31b-mlx-code
      api_base: http://192.168.4.8:11434
    model_info:
      max_input_tokens: 131072
      max_output_tokens: 16384

  - model_name: gemma4:31b-mlx-code
    litellm_params:
      model: ollama_chat/gemma4:31b-mlx-code
      api_base: http://192.168.4.8:11434
    model_info:
      max_input_tokens: 131072
      max_output_tokens: 16384

  - model_name: coding-31b
    litellm_params:
      model: ollama_chat/gemma4:31b-mlx-code
      api_base: http://192.168.4.8:11434
    model_info:
      max_input_tokens: 131072
      max_output_tokens: 16384

  # Primary STT routes (Local MLX Whisper on Apple Silicon Mac)
  - model_name: whisper
    litellm_params:
      model: openai/whisper
      api_base: http://192.168.4.8:8080/v1
      api_key: "none"
    model_info:
      mode: audio_transcription

  - model_name: whisper-1
    litellm_params:
      model: openai/whisper
      api_base: http://192.168.4.8:8080/v1
      api_key: "none"
    model_info:
      mode: audio_transcription

  # --- OpenRouter Free Models ---
  - model_name: gemma4-26b-free
    litellm_params:
      model: openrouter/google/gemma-4-26b-a4b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
      temperature: 0.0
      top_p: 0.95
      repetition_penalty: 1.05
      stop:
        - "</tool_call>"
        - "<|im_end|>"
    model_info:
      max_input_tokens: 262144
      max_output_tokens: 16384

  # -------------------------------------------------------------------------
  # Fallback Models: When ready, uncomment and supply API key in docker-compose.yml
  # -------------------------------------------------------------------------
  # - model_name: gemini-coding
  #   litellm_params:
  #     model: gemini/gemini-2.5-flash
  #     api_key: os.environ/GEMINI_API_KEY
  #
  # - model_name: cloud-whisper
  #   litellm_params:
  #     model: groq/whisper-large-v3
  #     api_key: os.environ/GROQ_API_KEY

litellm_settings:
  drop_params: true

router_settings:
  fallbacks:
    - gemma4-26b-free: ["coding-26b"]
  allowed_fails: 1
  cooldown_time: 60

general_settings:
  master_key: "sk-hermes-mac-secret"
