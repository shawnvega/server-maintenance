services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: hermes-gateway:custom
    container_name: hermes-gateway
    restart: unless-stopped
    command: ["gateway", "run"]
    shm_size: "1gb"
    mem_limit: 4096m
    mem_reservation: 1024m
    cpus: 1.5
    ports:
      - "9119:9119"
      - "8642:8642"
    environment:
      - HERMES_UID=1000
      - HERMES_GID=1000
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USERNAME:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD:-hermesadmin}
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${HERMES_API_KEY:-sk-hermes-agent-default-secure-key-4242}
      - API_SERVER_MODEL_NAME=${HERMES_API_MODEL_NAME:-hermes-agent}
      - OPENAI_BASE_URL=http://192.168.4.5:4000/v1
      - OPENAI_API_KEY=${LITELLM_API_KEY:-sk-hermes-mac-secret}
      - MODEL_NAME=${HERMES_MODEL:-coding-26b}
      - HERMES_TUI_RPC_TIMEOUT_MS=${HERMES_TUI_RPC_TIMEOUT_MS:-240000}
      - HERMES_STREAM_READ_TIMEOUT=${HERMES_STREAM_READ_TIMEOUT:-240}
    volumes:
      - /home/shawn/docker/hermes/data:/opt/data
      - /home/shawn/docker:/home/shawn/docker
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro
      - /etc/localtime:/etc/localtime:ro
    group_add:
      - "977"
    networks:
      - hermes-net

  desktop:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-desktop:minimal
    container_name: hermes-desktop
    restart: unless-stopped
    shm_size: "1gb"
    mem_limit: 1536m
    mem_reservation: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    ports:
      - "6080:6080"
    environment:
      - DISPLAY=:1
      - HOME=/home/hermes
      - HERMES_TUI_RPC_TIMEOUT_MS=${HERMES_TUI_RPC_TIMEOUT_MS:-240000}
      - HERMES_STREAM_READ_TIMEOUT=${HERMES_STREAM_READ_TIMEOUT:-240}
    volumes:
      - /home/shawn/docker/hermes/data:/home/hermes/workspace
      - /home/shawn/docker:/home/shawn/docker
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
    group_add:
      - "977"
    networks:
      - hermes-net

networks:
  hermes-net:
    driver: bridge
