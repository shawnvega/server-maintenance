services:
  frigate:
    container_name: frigate
    privileged: true # this may not be necessary for all setups
    restart: unless-stopped
    stop_grace_period: 30s # allow enough time to shut down the various services
    image: ghcr.io/blakeblackshear/frigate:stable
    shm_size: "512mb" # update for your cameras based on calculation above
    devices:
      - /dev/bus/usb:/dev/bus/usb # Passes the USB Coral, needs to be modified for other versions
        #- /dev/apex_0:/dev/apex_0 # Passes a PCIe Coral, follow driver instructions here https://coral.ai/docs/m2/get-started/#2a-on-linux
        #- /dev/video11:/dev/video11 # For Raspberry Pi 4B
      - /dev/dri/renderD128:/dev/dri/renderD128 # For intel hwaccel, needs to be updated for your hardware
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /srv/67e597dd-6061-415d-8a37-2246eabee10a/frigate/config:/config
      - /srv/67e597dd-6061-415d-8a37-2246eabee10a/frigate/media:/media/frigate
      - type: tmpfs # Optional: 1GB of memory, reduces SSD/SD Card wear
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "8971:8971"
      # - "5000:5000" # Internal unauthenticated access. Expose carefully.
      - "8554:8554" # RTSP feeds
      - "8555:8555/tcp" # WebRTC over tcp
      - "8555:8555/udp" # WebRTC over udp
    environment:
      - LIBVA_DRIVER_NAME=iHD # for 4th gen intel celeron CPU N2840 use: lscpu | grep "Model name"
      - FRIGATE_NEST_OAUTH_CLIENT_ID=${FRIGATE_NEST_OAUTH_CLIENT_ID}
      - FRIGATE_NEST_OAUTH_CLIENT_SECRET=${FRIGATE_NEST_OAUTH_CLIENT_SECRET}
      - FRIGATE_NEST_DEVICE_REFRESH_TOKEN=${FRIGATE_NEST_DEVICE_REFRESH_TOKEN}
      - FRIGATE_NEST_DEVICE_ACCESS_PROJECT_ID=ad0513d7-9482-428b-a89d-158114493092
      - FRIGATE_NEST_CAMERA_ID_KITCHEN=AVPHwEuBebdFKQITYuYl5c2yighTM0wsuhg9IaQvhDiJwuE5kj5VtqL1LlDlxn0cGyQpydFf4xjHOooXUybYnWO8aiuJEw
      - FRIGATE_NEST_CAMERA_ID_FRONT_YARD=AVPHwEvMVaZcycWqgQtYQUCKZ81c78O3ghO6MeTFL_Bv_8BmNA6_GnO18MInztUwavqSx5S7fcrgK9pOO5yfQdyWgPML2w

