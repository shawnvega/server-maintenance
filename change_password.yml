---
- name: Change Password Across All Servers and PiKVM
  hosts: servers
  gather_facts: false

  vars_prompt:
    - name: new_password
      prompt: "Enter new universal password for all servers and PiKVM admin"
      private: true
      confirm: true

  tasks:
    # -------------------------------------------------------------------------
    # 0. Pre-Flight Validation
    # -------------------------------------------------------------------------
    - name: Validate that new password is not empty
      ansible.builtin.assert:
        that:
          - new_password is defined
          - new_password | length > 0
        fail_msg: "New password cannot be empty."
        quiet: true
      run_once: true

    # -------------------------------------------------------------------------
    # 1. Standard Servers (192.168.4.4, .5, .18, .19)
    # -------------------------------------------------------------------------
    - name: Update password on standard servers
      when: inventory_hostname in groups['standard_servers']
      block:
        - name: Set new password for user shawn
          become: true
          ansible.builtin.command:
            cmd: chpasswd
            stdin: "shawn:{{ new_password }}"
          no_log: true

        - name: Update in-memory become credentials for standard servers
          ansible.builtin.set_fact:
            ansible_become_password: "{{ new_password }}"
            ansible_become_pass: "{{ new_password }}"
          no_log: true

        - name: Confirm standard server password updated
          ansible.builtin.debug:
            msg: "Password updated successfully for user shawn on {{ inventory_hostname }}"

    # -------------------------------------------------------------------------
    # 2. PiKVM Server (192.168.4.66 - Arch Linux ARM)
    # -------------------------------------------------------------------------
    - name: Update passwords on PiKVM server
      when: inventory_hostname in groups['pikvm_servers']
      block:
        - name: Remount PiKVM root filesystem as Read/Write
          ansible.builtin.command: /usr/bin/rw
          changed_when: false

        - name: Set new password for root user on PiKVM
          ansible.builtin.command:
            cmd: chpasswd
            stdin: "root:{{ new_password }}"
          no_log: true

        - name: Set new password for PiKVM Web UI admin user
          ansible.builtin.command:
            cmd: kvmd-htpasswd set admin -i -q
            stdin: "{{ new_password }}"
          no_log: true
      always:
        - name: Remount PiKVM root filesystem as Read-Only
          ansible.builtin.command: /usr/bin/ro
          changed_when: false

        - name: Verify PiKVM root filesystem is safely in Read-Only mode
          ansible.builtin.shell: |
            findmnt -n -o OPTIONS / | grep -qw ro
          changed_when: false

        - name: Confirm PiKVM passwords updated
          ansible.builtin.debug:
            msg: "Linux root password and Web UI admin password updated successfully on PiKVM ({{ inventory_hostname }})"

    # -------------------------------------------------------------------------
    # 3. Read-Only Pi (192.168.4.11 - OverlayFS)
    # -------------------------------------------------------------------------
    - name: Update password on Read-Only Pi
      when: inventory_hostname in groups['readonly_servers']
      block:
        - name: Check current running overlay status
          become: true
          ansible.builtin.command: raspi-config nonint get_overlay_now
          register: overlay_status
          changed_when: false
          failed_when: false

        - name: Disable OverlayFS if currently active
          become: true
          when: (overlay_status.stdout | default('1') | trim) == '0'
          ansible.builtin.command: raspi-config nonint do_overlayfs 1

        - name: Reboot into Read/Write mode and wait for host
          become: true
          when: (overlay_status.stdout | default('1') | trim) == '0'
          ansible.builtin.reboot:
            msg: "Rebooting into Read/Write mode to update password"
            pre_reboot_delay: 2
            post_reboot_delay: 10
            reboot_timeout: 600
            connect_timeout: 15

        - name: Verify root filesystem is running in Read/Write mode
          become: true
          ansible.builtin.command: raspi-config nonint get_overlay_now
          register: rw_check
          failed_when: rw_check.rc != 0 or (rw_check.stdout | trim) != '1'
          changed_when: false

        - name: Set new password for user shawn
          become: true
          ansible.builtin.command:
            cmd: chpasswd
            stdin: "shawn:{{ new_password }}"
          no_log: true

        - name: Update in-memory become credentials for Read-Only Pi
          ansible.builtin.set_fact:
            ansible_become_password: "{{ new_password }}"
            ansible_become_pass: "{{ new_password }}"
          no_log: true
      always:
        - name: Re-enable OverlayFS
          become: true
          when:
            - inventory_hostname in groups['readonly_servers']
            - (overlay_status.stdout | default('1') | trim) == '0'
          ansible.builtin.command: raspi-config nonint do_overlayfs 0

        - name: Reboot back into Read-Only mode and wait for host
          become: true
          when:
            - inventory_hostname in groups['readonly_servers']
            - (overlay_status.stdout | default('1') | trim) == '0'
          ansible.builtin.reboot:
            msg: "Rebooting back into Read-Only mode after password update"
            pre_reboot_delay: 2
            post_reboot_delay: 10
            reboot_timeout: 600
            connect_timeout: 15

        - name: Verify root filesystem is safely back in Read-Only mode
          become: true
          when:
            - inventory_hostname in groups['readonly_servers']
            - (overlay_status.stdout | default('1') | trim) == '0'
          ansible.builtin.command: raspi-config nonint get_overlay_now
          register: ro_check
          failed_when: ro_check.rc != 0 or (ro_check.stdout | trim) != '0'
          changed_when: false

        - name: Confirm Read-Only Pi password updated
          when: inventory_hostname in groups['readonly_servers']
          ansible.builtin.debug:
            msg: "Password updated successfully for user shawn on Read-Only Pi ({{ inventory_hostname }})"
