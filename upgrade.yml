---
- name: Upgrade standard home servers natively
  hosts: standard_servers
  gather_facts: true

  tasks:
    # -------------------------------------------------------------
    # Stage 1: System Load Check
    # -------------------------------------------------------------
    - name: Check current system load
      tags: [load_check]
      ansible.builtin.shell:
        cmd: "awk '{print $1}' /proc/loadavg"
      register: current_load
      changed_when: false
      check_mode: false

    - name: Display current system load
      tags: [load_check]
      ansible.builtin.debug:
        msg: "Current 1-min load: {{ current_load.stdout }} (threshold: {{ load_threshold | default(4.0) }})"

    - name: "Wait for system load to drop below threshold (<= {{ load_threshold | default(4.0) }})"
      tags: [load_check]
      when: (current_load.stdout | default('0') | float) > (load_threshold | default(4.0) | float)
      ansible.builtin.shell:
        cmd: "awk '{print $1}' /proc/loadavg"
      register: wait_load
      until: (wait_load.stdout | default('0') | float) <= (load_threshold | default(4.0) | float)
      retries: 30
      delay: 30
      changed_when: false
      check_mode: false

    - name: Display updated system load
      tags: [load_check]
      when: (current_load.stdout | default('0') | float) > (load_threshold | default(4.0) | float)
      ansible.builtin.debug:
        msg: "System load dropped to: {{ wait_load.stdout }} (threshold: {{ load_threshold | default(4.0) }})"

    # -------------------------------------------------------------
    # Stage 2: Backup (rpi-clone)
    # -------------------------------------------------------------
    - name: Run pre-upgrade backup via rpi-clone
      tags: [backup]
      when: backup_method | default('none') == 'rpi-clone'
      become: true
      ansible.builtin.command:
        cmd: "rpi-clone -u -v {{ backup_device }}"
      register: clone_result
      async: 1800
      poll: 15

    - name: Display backup summary
      tags: [backup]
      when: backup_method | default('none') == 'rpi-clone'
      ansible.builtin.debug:
        var: clone_result.stdout_lines

    # -------------------------------------------------------------
    # Stage 3: OS Package Upgrade (apt on Debian / dnf on Fedora)
    # -------------------------------------------------------------
    - name: Ensure journald configuration drop-in directory exists
      tags: [os]
      become: true
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"

    - name: Configure journald maximum disk usage cap (100M)
      tags: [os]
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/maxsize.conf
        content: |
          [Journal]
          SystemMaxUse=100M
        mode: "0644"
      register: journal_conf

    - name: Restart systemd-journald if configuration updated
      tags: [os]
      become: true
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted
      when: journal_conf.changed

    - name: Vacuum systemd journal logs to 100M
      tags: [os]
      become: true
      ansible.builtin.command:
        cmd: "journalctl --vacuum-size=100M"
      changed_when: false

    - name: Clean apt cache before upgrade to free disk space
      tags: [os]
      when: ansible_facts['os_family'] == 'Debian'
      become: true
      ansible.builtin.apt:
        clean: true
      changed_when: false

    - name: Upgrade OS packages on Debian / Raspberry Pi OS
      tags: [os]
      when: ansible_facts['os_family'] == 'Debian'
      become: true
      ansible.builtin.apt:
        update_cache: true
        upgrade: full
        autoremove: true
        autoclean: true
        purge: true
      register: apt_result

    - name: Upgrade OS packages on Fedora / RedHat
      tags: [os]
      when: ansible_facts['os_family'] == 'RedHat'
      become: true
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true
      register: dnf_result

    # -------------------------------------------------------------
    # Stage 4: Docker Stacks (Minimal Downtime: Pull first, then up -d)
    # -------------------------------------------------------------
    - name: Pull updated Docker images while containers stay online
      tags: [docker]
      loop: "{{ docker_stacks | default([]) }}"
      ansible.builtin.command:
        cmd: "docker compose pull"
        chdir: "{{ ansible_facts['user_dir'] }}/{{ item }}"
      register: docker_pull_out
      # Docker pulls images in background while services continue running
      async: 900
      poll: 10
      changed_when: false

    - name: Restart Docker stacks with load check between each stack
      tags: [docker]
      ansible.builtin.include_tasks: tasks/restart_docker_stack.yml
      loop: "{{ docker_stacks | default([]) }}"
      loop_control:
        loop_var: stack_item

    - name: Prune dangling and unused Docker images
      tags: [docker]
      when:
        - docker_stacks is defined
        - (docker_stacks | length) > 0
      ansible.builtin.command:
        cmd: "docker image prune -a -f"
      register: docker_prune_out
      changed_when: "'Deleted Images:' in docker_prune_out.stdout"
      failed_when: false
