---
- name: Deploy Hermes Agent to Fedora Workstation
  hosts: 192.168.4.19
  gather_facts: true
  vars:
    stack_item: "docker/hermes"
  tasks:
    - name: Load vault variables if available
      ansible.builtin.include_vars:
        file: vars/vault.yml
      failed_when: false

    - name: Deploy and restart Hermes stack
      ansible.builtin.include_tasks: tasks/restart_docker_stack.yml

- name: Authorize Hermes Agent SSH key on cluster targets
  hosts: 192.168.4.18
  gather_facts: false
  tasks:
    - name: Ensure Hermes agent public key is authorized on 192.168.4.18
      ansible.posix.authorized_key:
        user: shawn
        state: present
        key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGPtLoQtY9QhQwf5RnDfuNWgV7qmCQvjLZ13jul5CoaI hermes-agent-deploy-key"

