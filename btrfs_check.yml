---
- name: Inspect Btrfs filesystems and verify device health
  hosts: "{{ target_hosts | default('btrfs_servers') }}"
  become: true
  gather_facts: false

  tasks:
    # -------------------------------------------------------------
    # 1. Query Btrfs Filesystems, Device Stats, Scrub & Balance Status
    # -------------------------------------------------------------
    - name: Query Btrfs filesystem status and health metrics
      ansible.builtin.shell: |
        python3 - << 'EOF'
        import json, os, shutil, subprocess, sys

        def run(cmd):
            p = subprocess.run(cmd, shell=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
            return p.stdout.strip(), p.stderr.strip(), p.returncode

        btrfs_bin = shutil.which("btrfs") or "/usr/bin/btrfs"
        if not shutil.which("btrfs") and not os.path.exists(btrfs_bin):
            print(json.dumps([]))
            sys.exit(0)

        findmnt_bin = shutil.which("findmnt") or "/usr/bin/findmnt"
        lines = []
        if shutil.which("findmnt") or os.path.exists(findmnt_bin):
            findmnt_out, _, _ = run(f"{findmnt_bin} --list --all --canonicalize --notruncate --nofsroot --uniq --noheadings --output TARGET,UUID,LABEL --types btrfs")
            lines = [l.strip() for l in findmnt_out.splitlines() if l.strip()]

        if not lines:
            try:
                with open("/proc/mounts", "r") as f:
                    for l in f:
                        p = l.split()
                        if len(p) >= 3 and p[2] == "btrfs":
                            lines.append(f"{p[1]} unknown")
            except Exception:
                pass

        seen_uuids = set()
        filesystems = []

        for line in lines:
            parts = line.split()
            if not parts:
                continue
            target = parts[0]
            uuid = parts[1] if len(parts) > 1 else "unknown"
            label = " ".join(parts[2:]) if len(parts) > 2 else ""

            dedup_key = uuid if (uuid and uuid != "unknown") else target
            if dedup_key in seen_uuids:
                continue
            seen_uuids.add(dedup_key)

            usage_out, usage_err, _ = run(f"{btrfs_bin} filesystem usage -T {target}")
            usage = usage_out if usage_out else usage_err
            dev_stats_out, dev_stats_err, _ = run(f"{btrfs_bin} device stats {target}")
            dev_stats = dev_stats_out if dev_stats_out else dev_stats_err
            scrub_out, scrub_err, _ = run(f"{btrfs_bin} scrub status {target}")
            scrub = scrub_out if scrub_out else scrub_err
            balance_out, balance_err, _ = run(f"{btrfs_bin} balance status {target}")
            balance = balance_out if balance_out else balance_err

            errors = []
            for s in dev_stats.splitlines():
                s_clean = s.strip()
                if s_clean and not s_clean.endswith(" 0"):
                    errors.append(s_clean)

            # Determine scrub state
            scrub_state = "unknown"
            if "running" in scrub.lower():
                scrub_state = "running"
            elif "finished" in scrub.lower():
                scrub_state = "finished"
            elif "no stats available" in scrub.lower() or "never" in scrub.lower():
                scrub_state = "never run"
            elif "aborted" in scrub.lower() or "canceled" in scrub.lower():
                scrub_state = "canceled"

            filesystems.append({
                "target": target,
                "uuid": uuid,
                "label": label or "none",
                "has_device_errors": len(errors) > 0,
                "error_count": len(errors),
                "device_errors": errors,
                "dev_stats_raw": dev_stats,
                "scrub_state": scrub_state,
                "scrub_status": scrub,
                "balance_status": balance,
                "usage": usage
            })

        print(json.dumps(filesystems))
        EOF
      register: btrfs_inspection_raw
      changed_when: false

    - name: Parse Btrfs inspection results
      ansible.builtin.set_fact:
        btrfs_pools: "{{ btrfs_inspection_raw.stdout | from_json }}"

    # -------------------------------------------------------------
    # 2. Detailed Per-Pool Status Reports
    # -------------------------------------------------------------
    - name: Display Btrfs filesystem status and allocation
      ansible.builtin.debug:
        msg:
          - "================================================================================"
          - "FILESYSTEM: {{ item.target }} (Label: {{ item.label }}, UUID: {{ item.uuid }})"
          - "--------------------------------------------------------------------------------"
          - "DEVICE ERROR STATUS: {{ 'ATTENTION: Non-zero I/O errors found!' if item.has_device_errors else 'OK: All device error counters are 0' }}"
          - "SCRUB STATUS ({{ item.scrub_state | upper }}):"
          - "{{ item.scrub_status.splitlines() }}"
          - "BALANCE STATUS:"
          - "{{ item.balance_status.splitlines() }}"
          - "ALLOCATION & USAGE (btrfs fi usage -T):"
          - "{{ item.usage.splitlines() }}"
          - "================================================================================"
      loop: "{{ btrfs_pools }}"
      loop_control:
        label: "{{ item.target }} [{{ item.label }}]"

    # -------------------------------------------------------------
    # 3. Highlight Non-Zero Device Errors (Advisory Warnings)
    # -------------------------------------------------------------
    - name: "WARNING: Device I/O errors detected on Btrfs filesystem"
      when: item.has_device_errors
      ansible.builtin.debug:
        msg:
          - "********************************************************************************"
          - "WARNING: NON-ZERO BTRFS DEVICE I/O ERRORS ON {{ inventory_hostname }}"
          - "Filesystem: {{ item.target }} (Label: {{ item.label }}, UUID: {{ item.uuid }})"
          - "Affected Devices & Error Counters:"
          - "{{ item.device_errors }}"
          - "Run 'sudo btrfs device stats {{ item.target }}' on {{ inventory_hostname }} for details."
          - "********************************************************************************"
      loop: "{{ btrfs_pools }}"
      loop_control:
        label: "{{ item.target }} [{{ item.label }}]"

    # -------------------------------------------------------------
    # 4. Host Summary
    # -------------------------------------------------------------
    - name: Host Btrfs Health Summary
      vars:
        error_pools: "{{ btrfs_pools | selectattr('has_device_errors') | map(attribute='target') | list }}"
      ansible.builtin.debug:
        msg: >-
          {{
            'ATTENTION: ' ~ (error_pools | length) ~ ' Btrfs pool(s) on ' ~ inventory_hostname ~ ' report device I/O errors: ' ~ (error_pools | join(', '))
            if (error_pools | length) > 0
            else (
              'HEALTHY: All ' ~ (btrfs_pools | length) ~ ' Btrfs filesystem(s) on ' ~ inventory_hostname ~ ' report 0 device errors.'
              if (btrfs_pools | length) > 0
              else 'INFO: No mounted Btrfs filesystems found on ' ~ inventory_hostname ~ '.'
            )
          }}
