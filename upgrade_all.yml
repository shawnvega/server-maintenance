---
- name: Concurrent upgrade across all home servers (standard + read-only Pi)
  hosts: servers
  strategy: free
  gather_facts: true

  tasks:
    # =============================================================
    # Stage RO-1: Read-Only Pi Overlay Preparation (192.168.4.11)
    # =============================================================
    - name: "[RO-Pi] Check initial overlay filesystem status"
      tags: [readonly, check]
      when: overlay_readonly | default(false)
      become: true
      ansible.builtin.command:
        cmd: "raspi-config nonint get_overlay_now"
      register: initial_overlay_status
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "[RO-Pi] Disable overlay filesystem (switch config to Read/Write)"
      tags: [readonly, rw]
      when:
        - overlay_readonly | default(false)
        - initial_overlay_status is defined
        - initial_overlay_status.rc | default(1) == 0
      become: true
      ansible.builtin.command:
        cmd: "raspi-config nonint do_overlayfs 1"

    - name: "[RO-Pi] Reboot into Read/Write mode and wait for host to return"
      tags: [readonly, rw, reboot]
      when:
        - overlay_readonly | default(false)
        - initial_overlay_status is defined
        - initial_overlay_status.rc | default(1) == 0
      become: true
      ansible.builtin.reboot:
        msg: "Rebooting into Read/Write mode for maintenance"
        pre_reboot_delay: 2
        post_reboot_delay: 10
        reboot_timeout: 300

    - name: "[RO-Pi] Verify filesystem is running in Read/Write mode"
      tags: [readonly, rw]
      when: overlay_readonly | default(false)
      become: true
      ansible.builtin.command:
        cmd: "raspi-config nonint get_overlay_now"
      register: rw_check
      failed_when: rw_check.rc != 1
      changed_when: false
      check_mode: false

    # =============================================================
    # Stage STD-1: Standard Servers Load Check & Backups
    # =============================================================
    - name: "[Standard] Check current system load"
      tags: [load_check]
      when: not (overlay_readonly | default(false))
      ansible.builtin.shell:
        cmd: "awk '{print $1}' /proc/loadavg"
      register: current_load
      changed_when: false
      check_mode: false

    - name: "[Standard] Display current system load"
      tags: [load_check]
      when: not (overlay_readonly | default(false))
      ansible.builtin.debug:
        msg: "Current 1-min load: {{ current_load.stdout }} (threshold: {{ load_threshold | default(4.0) }})"

    - name: "[Standard] Wait for system load to drop below threshold"
      tags: [load_check]
      when:
        - not (overlay_readonly | default(false))
        - (current_load.stdout | default('0') | float) > (load_threshold | default(4.0) | float)
      ansible.builtin.shell:
        cmd: "awk '{print $1}' /proc/loadavg"
      register: wait_load
      until: (wait_load.stdout | default('0') | float) <= (load_threshold | default(4.0) | float)
      retries: 20
      delay: 30
      changed_when: false
      check_mode: false

    - name: "[Standard] Display updated system load"
      tags: [load_check]
      when:
        - not (overlay_readonly | default(false))
        - (current_load.stdout | default('0') | float) > (load_threshold | default(4.0) | float)
      ansible.builtin.debug:
        msg: "System load dropped to: {{ wait_load.stdout }} (threshold: {{ load_threshold | default(4.0) }})"

    - name: "[Standard] Run pre-upgrade backup via rpi-clone"
      tags: [backup]
      when:
        - not (overlay_readonly | default(false))
        - backup_method | default('none') == 'rpi-clone'
      become: true
      ansible.builtin.command:
        cmd: "rpi-clone -u -v {{ backup_device }}"
      register: clone_result
      async: 1800
      poll: 15

    - name: "[Standard] Display backup summary"
      tags: [backup]
      when:
        - not (overlay_readonly | default(false))
        - backup_method | default('none') == 'rpi-clone'
      ansible.builtin.debug:
        var: clone_result.stdout_lines

    # =============================================================
    # Stage 3: OS Package Upgrades (Concurrent on all servers)
    # =============================================================
    - name: "[All] Ensure journald configuration drop-in directory exists"
      tags: [os]
      become: true
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"

    - name: "[All] Configure journald maximum disk usage cap (100M)"
      tags: [os]
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/maxsize.conf
        content: |
          [Journal]
          SystemMaxUse=100M
        mode: "0644"
      register: journal_conf

    - name: "[All] Restart systemd-journald if configuration updated"
      tags: [os]
      become: true
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted
      when: journal_conf.changed

    - name: "[All] Vacuum systemd journal logs to 100M"
      tags: [os]
      become: true
      ansible.builtin.command:
        cmd: "journalctl --vacuum-size=100M"
      changed_when: false

    - name: "[Debian] Clean apt cache before upgrade to free disk space"
      tags: [os]
      when: ansible_facts['os_family'] == 'Debian'
      become: true
      ansible.builtin.apt:
        clean: true
      changed_when: false

    - name: "[All] Upgrade OS packages on Debian / Raspberry Pi OS"
      tags: [os]
      when: ansible_facts['os_family'] == 'Debian'
      become: true
      ansible.builtin.apt:
        update_cache: true
        upgrade: full
        autoremove: true
        autoclean: true
        purge: true
      register: apt_result

    - name: "[All] Upgrade OS packages on Fedora / RedHat"
      tags: [os]
      when: ansible_facts['os_family'] == 'RedHat'
      become: true
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true
      register: dnf_result

    # =============================================================
    # Stage 4: Docker Stacks (Standard Servers, Minimal Downtime)
    # =============================================================
    - name: "[Standard] Pull updated Docker images while containers stay online"
      tags: [docker]
      when:
        - not (overlay_readonly | default(false))
        - docker_stacks is defined
      loop: "{{ docker_stacks | default([]) }}"
      ansible.builtin.command:
        cmd: "docker compose pull"
        chdir: "{{ ansible_facts['user_dir'] }}/{{ item }}"
      register: docker_pull_out
      async: 900
      poll: 10
      changed_when: false

    - name: "[Standard] Restart Docker stacks with load check between each stack"
      tags: [docker]
      when:
        - not (overlay_readonly | default(false))
        - docker_stacks is defined
      ansible.builtin.include_tasks: tasks/restart_docker_stack.yml
      loop: "{{ docker_stacks | default([]) }}"
      loop_control:
        loop_var: stack_item

    - name: "[Standard] Prune dangling and unused Docker images"
      tags: [docker]
      when:
        - not (overlay_readonly | default(false))
        - docker_stacks is defined
        - (docker_stacks | length) > 0
      ansible.builtin.command:
        cmd: "docker image prune -a -f"
      register: docker_prune_out
      changed_when: "'Deleted Images:' in docker_prune_out.stdout"
      failed_when: false

    # =============================================================
    # Stage RO-2: Read-Only Pi Restore & Final Reboot (192.168.4.11)
    # =============================================================
    - name: "[RO-Pi] Re-enable overlay filesystem (switch config to Read-Only)"
      tags: [readonly, ro]
      when: overlay_readonly | default(false)
      become: true
      ansible.builtin.command:
        cmd: "raspi-config nonint do_overlayfs 0"

    - name: "[RO-Pi] Reboot back into Read-Only mode and wait for host to return"
      tags: [readonly, ro, reboot]
      when: overlay_readonly | default(false)
      become: true
      ansible.builtin.reboot:
        msg: "Rebooting back into Read-Only mode"
        pre_reboot_delay: 2
        post_reboot_delay: 10
        reboot_timeout: 300

    - name: "[RO-Pi] Verify filesystem is safely back in Read-Only mode"
      tags: [readonly, ro]
      when: overlay_readonly | default(false)
      become: true
      ansible.builtin.command:
        cmd: "raspi-config nonint get_overlay_now"
      register: ro_check
      failed_when: ro_check.rc != 0
      changed_when: false
      check_mode: false
