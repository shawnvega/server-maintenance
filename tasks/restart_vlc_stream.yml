---
- name: Check if VLC stream process is already running
  tags: [vlc, snap, os]
  ansible.builtin.shell:
    cmd: "pgrep -x vlc"
  register: vlc_running_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Stop running VLC stream and wait for process termination (when force restart requested)
  tags: [vlc, snap, os]
  when:
    - force_vlc_restart | default(false) | bool
    - vlc_running_check.rc == 0
  ansible.builtin.shell:
    cmd: |
      pkill -x vlc 2>/dev/null || true
      for i in 1 2 3 4 5; do
        pgrep -x vlc >/dev/null || break
        sleep 1
      done
      pkill -9 -x vlc 2>/dev/null || true
      sleep 2
  changed_when: false
  failed_when: false

- name: Wait for any active snap auto-refresh to complete before starting VLC
  tags: [vlc, snap, os]
  when: (vlc_running_check.rc != 0) or (force_vlc_restart | default(false) | bool)
  ansible.builtin.shell:
    cmd: |
      if command -v snap >/dev/null 2>&1; then
        for id in $(snap changes | awk '$2 == "Doing" {print $1}'); do
          snap watch "$id" || true
        done
      fi
  changed_when: false
  failed_when: false

- name: Start VLC fullscreen stream in background
  tags: [vlc, snap, os]
  when: (vlc_running_check.rc != 0) or (force_vlc_restart | default(false) | bool)
  ansible.builtin.shell:
    cmd: >-
      nohup vlc {{ vlc_stream_options | default('--fullscreen') }} "{{ vlc_stream_url }}"
      </dev/null >/dev/null 2>&1 &
  environment:
    DISPLAY: "{{ vlc_display | default(':0') }}"
    XAUTHORITY: "{{ ansible_facts['user_dir'] }}/.Xauthority"
  changed_when: true
  failed_when: false

- name: Verify VLC stream process is running
  tags: [vlc, snap, os]
  ansible.builtin.shell:
    cmd: "pgrep -x vlc"
  register: vlc_pgrep
  until: vlc_pgrep.rc == 0
  retries: 15
  delay: 2
  changed_when: false
  failed_when: vlc_pgrep.rc != 0

- name: Display VLC stream status and PID
  tags: [vlc, snap, os]
  ansible.builtin.debug:
    msg: >-
      {{ 'VLC stream restarted successfully with PID(s): ' if ((vlc_running_check.rc != 0) or (force_vlc_restart | default(false) | bool)) else 'VLC stream already running with PID(s): ' }}{{ vlc_pgrep.stdout_lines | join(', ') }}
